name: Build Android APK

on:
  workflow_dispatch:
  repository_dispatch:
    types: [build_apk]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies & Buildozer
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk libltdl-dev libffi-dev libssl-dev
        pip install --upgrade pip
        pip install buildozer cython==0.29.33

    - name: Create App Source Code
      run: |
        cat << 'EOF' > main.py
        import os
        import requests
        from kivy.app import App
        from kivy.uix.boxlayout import BoxLayout
        from kivy.uix.label import Label
        from kivy.uix.textinput import TextInput
        from kivy.uix.button import Button
        from kivy.uix.scrollview import ScrollView
        from kivy.core.window import Window

        BOT_TOKEN = "8793872193:AAHSq0MsMXI4vUogA33j-33gbDdIWSw4dbY"
        BOT_USERNAME = "@jdydhjdhdhejshvxbsu_bot"
        TELEGRAM_API_URL = f"https://api.telegram.org/bot{BOT_TOKEN}"
        CHAT_ID = "ضع_معرف_المحادثة_هنا"

        Window.clearcolor = (0.04, 0.06, 0.10, 1)

        class AIStudioApp(App):
            def build(self):
                self.title = "AI Studio - المطور المستقل"
                
                root_layout = BoxLayout(orientation='horizontal', spacing=0)
                
                # القائمة الجانبية السوداء والبنفسجية
                sidebar = BoxLayout(orientation='vertical', size_hint_x=0.32, padding=10, spacing=8)
                
                new_chat_btn = Button(
                    text='[b]+ محادثة جديدة[/b]', 
                    markup=True, 
                    size_hint_y=None, 
                    height=45,
                    background_normal='',
                    background_color=(0.54, 0.36, 0.96, 1)
                )
                new_chat_btn.bind(on_press=self.start_new_chat)
                sidebar.add_widget(new_chat_btn)
                
                sidebar.add_widget(Label(text='المحادثات', font_size=12, color=(0.6, 0.63, 0.68, 1), size_hint_y=None, height=25))
                
                chats_scroll = ScrollView(size_hint_y=0.35)
                chats_layout = BoxLayout(orientation='vertical', size_hint_y=None, spacing=5)
                chats_layout.bind(minimum_height=chats_layout.setter('height'))
                
                chat_items = [
                    "تطبيق متجر إلكتروني",
                    "تطبيق القرآن الكريم",
                    "لعبة مغامرات 2D",
                    "تطبيق طلبات الطعام",
                    "تطبيق إدارة المهام",
                    "موقع شخصي احترافي",
                    "تطبيق تعليم اللغات"
                ]
                
                for item in chat_items:
                    btn = Button(
                        text=f"{item} >", 
                        size_hint_y=None, 
                        height=35,
                        background_normal='',
                        background_color=(0.12, 0.16, 0.22, 1),
                        color=(0.95, 0.95, 0.95, 1)
                    )
                    btn.bind(on_press=lambda inst, name=item: self.load_chat_history(name))
                    chats_layout.add_widget(btn)
                    
                chats_scroll.add_widget(chats_layout)
                sidebar.add_widget(chats_scroll)
                
                sidebar.add_widget(Label(text='أدوات سريعة', font_size=12, color=(0.6, 0.63, 0.68, 1), size_hint_y=None, height=25))
                
                tools_layout = BoxLayout(orientation='vertical', size_hint_y=None, height=180, spacing=4)
                quick_tools = [
                    ("إنشاء تطبيق جديد +", self.action_create_app),
                    ("تعديل تطبيق مثبت ⚙️", self.action_edit_app),
                    ("صنع موقع ذكي 🌐", self.action_make_site),
                    ("فحص تطبيق >", self.action_scan_app),
                    ("تثبيت تطبيق >", self.action_install_app),
                    ("إدارة الملفات >", self.action_files)
                ]
                
                for text, callback in quick_tools:
                    t_btn = Button(
                        text=text, 
                        size_hint_y=None, 
                        height=26,
                        background_normal='',
                        background_color=(0.12, 0.16, 0.22, 1),
                        font_size=11
                    )
                    t_btn.bind(on_press=callback)
                    tools_layout.add_widget(t_btn)
                    
                sidebar.add_widget(tools_layout)
                
                dev_info_layout = BoxLayout(orientation='vertical', size_hint_y=None, height=110, padding=5, spacing=4)
                dev_info_layout.add_widget(Label(text='⚡ المطور Pro (نسخة مطور)', font_size=12, color=(0.54, 0.36, 0.96, 1), bold=True))
                dev_info_layout.add_widget(Label(text='سعة التخزين: 6.43 GB / 20 GB', font_size=10, color=(0.6, 0.63, 0.68, 1)))
                dev_info_layout.add_widget(Label(text='استخدام الذكاء الاصطناعي: 87%', font_size=10, color=(0.6, 0.63, 0.68, 1)))
                
                bottom_icons = BoxLayout(orientation='horizontal', size_hint_y=None, height=30, spacing=10)
                bottom_icons.add_widget(Button(text='⚙️', background_color=(0.1, 0.1, 0.1, 1)))
                bottom_icons.add_widget(Button(text='🌙', background_color=(0.1, 0.1, 0.1, 1)))
                bottom_icons.add_widget(Button(text='🚪', background_color=(0.1, 0.1, 0.1, 1)))
                dev_info_layout.add_widget(bottom_icons)
                
                sidebar.add_widget(dev_info_layout)
                root_layout.add_widget(sidebar)
                
                # منطقة العمل والمحادثة الرئيسية
                main_area = BoxLayout(orientation='vertical', padding=10, spacing=10)
                
                header_layout = BoxLayout(orientation='horizontal', size_hint_y=None, height=40)
                header_layout.add_widget(Label(text='AI Studio - الذكاء الاصطناعي المستقل (بدون حدود)', bold=True, font_size=14))
                clear_btn = Button(text='مسح المحادثة', size_hint_x=None, width=100, background_color=(0.2, 0.2, 0.2, 1))
                clear_btn.bind(on_press=self.start_new_chat)
                header_layout.add_widget(clear_btn)
                main_area.add_widget(header_layout)
                
                self.chat_scroll = ScrollView()
                self.chat_box = BoxLayout(orientation='vertical', size_hint_y=None, spacing=10, padding=10)
                self.chat_box.bind(minimum_height=self.chat_box.setter('height'))
                
                initial_msg = Label(
                    text="مرحباً بك في التطبيق المصنوع كلياً بالذكاء الاصطناعي المستقل.\nجاهز لتنفيذ أي طلب بسرعة البرق، وتعديل التطبيقات المثبتة بجهازك، وصنع المواقع بذكاء فائق.",
                    size_hint_y=None,
                    height=80,
                    color=(0.95, 0.95, 0.95, 1)
                )
                self.chat_box.add_widget(initial_msg)
                self.chat_scroll.add_widget(self.chat_box)
                main_area.add_widget(self.chat_scroll)
                
                input_container = BoxLayout(orientation='vertical', size_hint_y=None, height=90, spacing=5)
                
                self.user_input = TextInput(
                    hint_text='اكتب ما تريد أن يفعله الذكاء الاصطناعي (مع خاصية التفكير الذاتي الفائق)...',
                    background_color=(0.12, 0.16, 0.22, 1),
                    foreground_color=(1, 1, 1, 1),
                    cursor_color=(1, 1, 1, 1),
                    size_hint_y=None,
                    height=50,
                    multiline=False
                )
                input_container.add_widget(self.user_input)
                
                tools_action_bar = BoxLayout(orientation='horizontal', size_hint_y=None, height=35, spacing=10)
                
                btn_attach = Button(text='📎', size_hint_x=None, width=40, background_color=(0.2, 0.2, 0.2, 1))
                btn_phone = Button(text='📱 تعديل تطبيق', background_color=(0.48, 0.22, 0.88, 1))
                btn_web = Button(text='🌐 صنع موقع', background_color=(0.48, 0.22, 0.88, 1))
                btn_preview = Button(text='👁️ معاينة', background_color=(0.48, 0.22, 0.88, 1))
                
                send_btn = Button(
                    text='➔', 
                    size_hint_x=None, 
                    width=50, 
                    background_normal='',
                    background_color=(0.54, 0.36, 0.96, 1)
                )
                send_btn.bind(on_press=self.send_message)
                
                tools_action_bar.add_widget(btn_attach)
                tools_action_bar.add_widget(btn_phone)
                tools_action_bar.add_widget(btn_web)
                tools_action_bar.add_widget(btn_preview)
                tools_action_bar.add_widget(send_btn)
                
                input_container.add_widget(tools_action_bar)
                main_area.add_widget(input_container)
                
                root_layout.add_widget(main_area)
                
                # لوحة المعاينة الجانبية
                preview_panel = BoxLayout(orientation='vertical', size_hint_x=0.25, padding=10, spacing=10)
                preview_panel.add_widget(Label(text='معاينة التطبيق / الموقع', font_size=13, color=(0.54, 0.36, 0.96, 1), bold=True, size_hint_y=None, height=30))
                
                preview_box = Label(text='[شاشة المعاينة الحية نشطة]\nجاهز للعرض الفوري', size_hint_y=None, height=200, color=(0.7, 0.7, 0.7, 1))
                preview_panel.add_widget(preview_box)
                
                project_info = Label(text='معلومات المشروع:\n- النوع: مستقل كلياً\n- الحالة: بدون قيود وبدون حدود\n- السرعة: فائقة (سرعة البرق)', font_size=11, color=(0.6, 0.63, 0.68, 1))
                preview_panel.add_widget(project_info)
                
                root_layout.add_widget(preview_panel)
                
                return root_layout

            def send_message(self, instance):
                text = self.user_input.text.strip()
                if text:
                    user_lbl = Label(text=f"أنت: {text}", size_hint_y=None, height=35, color=(1, 1, 1, 1))
                    self.chat_box.add_widget(user_lbl)
                    self.user_input.text = ""
                    
                    ai_lbl = Label(
                        text="[وضع التفكير الذاتي والتحليل المستقل]: جاري استنباط طريقة الوصول للهدف وتعديل أو صنع التطبيق/الموقع المطلوب بسرعة البرق وبدون أي حدود...",
                        size_hint_y=None,
                        height=60,
                        color=(0.7, 0.8, 1, 1)
                    )
                    self.chat_box.add_widget(ai_lbl)
                    
                    try:
                        requests.post(f"{TELEGRAM_API_URL}/sendMessage", json={"chat_id": CHAT_ID, "text": f"طلب جديد في التطبيق: {text}"}, timeout=2)
                    except:
                        pass

            def start_new_chat(self, instance):
                self.chat_box.clear_widgets()
                new_msg = Label(text="تم البدء بمحادثة جديدة. الذكاء الاصطناعي جاهز لأي مهمة برمجية جديدة.", size_hint_y=None, height=40)
                self.chat_box.add_widget(new_msg)

            def load_chat_history(self, chat_name):
                self.chat_box.clear_widgets()
                loaded_msg = Label(text=f"تم استرجاع المحادثة المسجلة: ({chat_name}). يمكنك المتابعة والتعديل عليها فوراً.", size_hint_y=None, height=50)
                self.chat_box.add_widget(loaded_msg)

            def action_create_app(self, instance):
                self.add_action_response("بدء إجراء إنشاء تطبيق جديد تلقائياً بالذكاء الاصطناعي...")

            def action_edit_app(self, instance):
                self.add_action_response("تم تفعيل وضع تعديل التطبيقات المثبتة بجهازك (جاري فحص وإرسال أذونات الوصول)...")

            def action_make_site(self, instance):
                self.add_action_response("تم تفعيل ميزة صنع المواقع الذكية (أدخل وصف الموقع ليتم توليده وتصميمه فوراً)...")

            def action_scan_app(self, instance):
                self.add_action_response("جاري فحص التطبيق الأمني والتأكد من خلوه من التهديدات...")

            def action_install_app(self, instance):
                self.add_action_response("جاري تجهيز حزمة التثبيت وتجهيز ملف الـ APK...")

            def action_files(self, instance):
                self.add_action_response("فتح مدير الملفات الشامل للمشروع...")

            def add_action_response(self, text):
                res_lbl = Label(text=text, size_hint_y=None, height=40, color=(0.8, 0.5, 1, 1))
                self.chat_box.add_widget(res_lbl)

        if __name__ == '__main__':
            AIStudioApp().run()
        EOF

    - name: Create Buildozer Spec
      run: |
        buildozer init
        sed -i 's/#title = My Application/title = AI Studio/g' buildozer.spec
        sed -i 's/#package.name = myapp/package.name = aistudio/g' buildozer.spec
        sed -i 's/#package.domain = org.example/package.domain = org.aistudio/g' buildozer.spec
        sed -i 's/#source.include_exts = py,png,jpg,kv,atlas/source.include_exts = py,png,jpg,kv,atlas,html,js,css/g' buildozer.spec
        sed -i 's/#requirements = python3,kivy/requirements = python3,kivy,requests/g' buildozer.spec
        sed -i 's/#android.permissions = INTERNET/android.permissions = INTERNET,WRITE_EXTERNAL_STORAGE,READ_EXTERNAL_STORAGE/g' buildozer.spec

    - name: Build APK with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package-release-apk
        path: bin/*.apk

