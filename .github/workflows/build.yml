name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Java (Required for Buildozer/Android SDK)
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Dependencies & Buildozer
      run: |
        sudo rm -f /var/lib/apt/lists/lock
        sudo rm -f /var/cache/apt/archives/lock
        sudo dpkg --configure -a
        sudo apt-get update
        sudo apt-get install -y build-essential git python3-dev ccache libncursesw5-dev libffi-dev libssl-dev zlib1g-dev python3-pip zip unzip autoconf libtool pkg-config libltdl-dev
        pip install --upgrade pip
        pip install buildozer cython==0.29.33

    - name: Build APK with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload and Send APK to Telegram
      env:
        BOT_TOKEN: "8793872193:AAHSq0MsMXI4vUogA33j-33gbDdIWSw4dbY"
        CHAT_ID: "@jdydhjdhdhejshvxbsu_bot"
      run: |
        APK_FILE=$(find bin/ -name "*.apk" | head -n 1)
        if [ -f "$APK_FILE" ]; then
          curl -F chat_id="$CHAT_ID" -F document=@"$APK_FILE" "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
        else
          echo "APK file not found!"
          exit 1
        fi

