name: Build Android APK

on:
  push:
  workflow_dispatch:
  repository_dispatch:
    types: [build_apk]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies & Buildozer
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5
        pip install --upgrade pip
        pip install buildozer cython==0.29.33

    - name: Create App Source Code
      run: |
        cat << 'EOF' > main.py
        from kivy.app import App
        from kivy.uix.label import Label
        class MainApp(App):
            def build(self):
                return Label(text='App Built Successfully!')
        if __name__ == '__main__':
            MainApp().run()
        EOF

    - name: Create Buildozer Spec
      run: |
        buildozer init
        sed -i 's/#title = My Application/title = MyKivyApp/' buildozer.spec
        sed -i 's/#package.name = myapp/package.name = mykivyapp/' buildozer.spec
        sed -i 's/#package.domain = org.example/package.domain = org.app/' buildozer.spec
        sed -i 's/#requirements = python3,kivy/requirements = python3,kivy/' buildozer.spec

    - name: Build APK with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload and Send APK to Telegram
      env:
        BOT_TOKEN: "8793872193:AAHSq0MsMXI4vUogA33j-33gbDdIWSw4dbY"
        CHAT_ID: "8946111745"
      run: |
        apk_file=$(ls bin/*.apk | head -n 1)
        echo "Found APK: $apk_file"
        curl -F chat_id="$CHAT_ID" \
             -F document=@"$apk_file" \
             -F caption="🚀 تم بناء ملف التطبيق الأندرويد وإرساله إليك يا غالي" \
             https://api.telegram.org/bot$BOT_TOKEN/sendDocument
